name: OpenRHI Xmake SDK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  Source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'
      - run: xmake openrhi-check -P .
      - run: python3 Tests/test_xmake_build.py
  Native-SDK:
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
        target:
          - os: windows-latest
            plat: windows
            arch: x64
          - os: windows-latest
            plat: windows
            arch: arm64
          - os: windows-latest
            plat: windows
            arch: arm64ec
          - os: ubuntu-latest
            plat: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            plat: linux
            arch: arm64
          - os: macos-latest
            plat: macosx
            arch: arm64
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'
      - name: Linux native headers
        if: matrix.target.plat == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libwayland-dev
      - name: Configure native graph
        run: xmake f -P . -p ${{ matrix.target.plat }} -a ${{ matrix.target.arch }} -m ${{ matrix.mode }} --none=y --nis=y --build_tests=y -y
      - run: xmake build -P . -y OpenRHI
      - name: Native CPU contracts
        if: matrix.target.arch != 'arm64ec' && !(matrix.target.plat == 'windows' && matrix.target.arch == 'arm64')
        run: xmake test -P . "*/cpu"
      - name: Explicit NONE backend
        if: matrix.target.arch != 'arm64ec' && !(matrix.target.plat == 'windows' && matrix.target.arch == 'arm64')
        run: xmake test -P . OpenRHISmoke/NONE
      - run: xmake sdk -P .
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRHI-${{ matrix.target.plat }}-${{ matrix.target.arch }}-${{ matrix.mode }}
          path: _OpenRHI_SDK
  Android-SDK:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
        anf: ['n', 'y']
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'
      - uses: actions/checkout@v4
        if: matrix.anf == 'y'
        with:
          repository: SnapdragonGameStudios/adreno-neural-fusion
          ref: a144fbab47ad586adf64c5a1574be73064550f1e
          path: _ANF_SDK
      - name: Configure Android ARM64 API33
        run: xmake f -P . -p android -a arm64-v8a -m ${{ matrix.mode }} --ndk="$ANDROID_NDK_HOME" --ndk_sdkver=33 --static_library=y --none=y --nis=y --nvtx=n --anf=${{ matrix.anf }} --anf_root="$GITHUB_WORKSPACE/_ANF_SDK" -y
      - run: xmake build -P . -y OpenRHI
      - run: xmake sdk -P .
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRHI-android-arm64-${{ matrix.mode }}-anf-${{ matrix.anf }}
          path: _OpenRHI_SDK
  Apple-Mobile-SDK:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
        sdk: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'
      - run: xmake f -P . -p iphoneos -a arm64 -m ${{ matrix.mode }} --static_library=y --metal=y --nis=y --apple_sdk=${{ matrix.sdk }} --appledev=${{ matrix.sdk == 'iphonesimulator' && 'simulator' || 'iphone' }} -y
      - run: xmake build -P . -y OpenRHI
      - run: xmake sdk -P .
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRHI-${{ matrix.sdk }}-arm64-${{ matrix.mode }}
          path: _OpenRHI_SDK
