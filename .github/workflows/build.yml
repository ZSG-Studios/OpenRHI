name: OpenRHI SDK
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  Source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify backend source boundary
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P Tests/SourceBoundary.cmake

  Build-Windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Deploy
        run: .\Scripts\Windows\1-Deploy.bat -DOPENRHI_ENABLE_NIS_SDK=ON -DOPENRHI_ENABLE_IMGUI_EXTENSION=ON -DOPENRHI_BUILD_TESTS=ON -DOPENRHI_ENABLE_NONE_SUPPORT=ON

      - name: Build
        run: .\Scripts\Windows\2-Build.bat

      - name: Test dummy backend and source boundary
        run: ctest --test-dir _Build -C Release -R "OpenRHI.(NONE|PublicAPI|SourceBoundary|DevicePolicy|WindowsBinaryBoundary|PromotionGate|SlangContract)" --output-on-failure

      - name: Prepare SDK
        run: .\Scripts\Windows\3-PrepareSDK.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRHI SDK (Windows x64)
          path: _OpenRHI_SDK

  Build-Windows-ARM64:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Deploy
        run: .\Scripts\Windows\1-Deploy.bat -G "Visual Studio 17 2022" -A ARM64 -DOPENRHI_ENABLE_NIS_SDK=ON -DOPENRHI_ENABLE_IMGUI_EXTENSION=ON -DOPENRHI_BUILD_TESTS=ON -DOPENRHI_ENABLE_NONE_SUPPORT=ON

      - name: Build
        run: .\Scripts\Windows\2-Build.bat

      - name: Prepare SDK
        run: .\Scripts\Windows\3-PrepareSDK.bat

      - name: Audit native binary exports
        run: ctest --test-dir _Build -C Release -R OpenRHI.WindowsBinaryBoundary --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRHI SDK (Windows ARM64)
          path: _OpenRHI_SDK

  Build-Windows-ARM64EC:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Deploy
        run: .\Scripts\Windows\1-Deploy.bat -G "Visual Studio 17 2022" -A ARM64EC -DOPENRHI_ENABLE_NIS_SDK=ON -DOPENRHI_ENABLE_IMGUI_EXTENSION=ON -DOPENRHI_BUILD_TESTS=ON -DOPENRHI_ENABLE_NONE_SUPPORT=ON

      - name: Build
        run: .\Scripts\Windows\2-Build.bat

      - name: Prepare SDK
        run: .\Scripts\Windows\3-PrepareSDK.bat

      - name: Audit native binary exports
        run: ctest --test-dir _Build -C Release -R OpenRHI.WindowsBinaryBoundary --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRHI SDK (Windows ARM64EC)
          path: _OpenRHI_SDK

  Build-Ubuntu:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            nis: 'ON'
          - os: ubuntu-24.04-arm
            nis: 'ON'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libwayland-dev ninja-build

      - name: Deploy
        run: bash Scripts/Linux/1-Deploy.sh -DOPENRHI_ENABLE_NIS_SDK=${{ matrix.nis }} -DOPENRHI_BUILD_TESTS=ON -DOPENRHI_ENABLE_NONE_SUPPORT=ON

      - name: Build
        run: bash Scripts/Linux/2-Build.sh

      - name: Test dummy backend and source boundary
        run: ctest --test-dir _Build -C Release -R "OpenRHI.(NONE|PublicAPI|SourceBoundary|DevicePolicy|WindowsBinaryBoundary|PromotionGate|SlangContract)" --output-on-failure

      - name: Prepare SDK
        run: bash Scripts/Linux/3-PrepareSDK.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRHI SDK (Linux ${{ runner.arch }})
          path: _OpenRHI_SDK

  Build-Android-ARM64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Deploy
        run: >-
          bash Scripts/Linux/1-Deploy.sh
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-33
          -DOPENRHI_ENABLE_NIS_SDK=ON -DOPENRHI_ENABLE_IMGUI_EXTENSION=ON -DOPENRHI_BUILD_TESTS=ON -DOPENRHI_ENABLE_NONE_SUPPORT=ON

      - name: Build
        run: cmake --build _Build --parallel

      - name: Prepare SDK
        run: bash Scripts/Linux/3-PrepareSDK.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRHI SDK (Android ARM64)
          path: _OpenRHI_SDK

  Build-macOS:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Install dependencies
        run: |
          brew install ninja
          xcodebuild -downloadComponent MetalToolchain

      - name: Deploy
        run: >-
          bash Scripts/MacOS/1-Deploy.sh
          -DOPENRHI_ENABLE_NIS_SDK=ON -DOPENRHI_ENABLE_IMGUI_EXTENSION=ON -DOPENRHI_BUILD_TESTS=ON -DOPENRHI_ENABLE_NONE_SUPPORT=ON
          -DOPENRHI_ENABLE_METAL_SUPPORT=ON

      - name: Build
        run: bash Scripts/MacOS/2-Build.sh

      - name: Test dummy backend and source boundary
        run: ctest --test-dir _Build -C Release -R "OpenRHI.(NONE|PublicAPI|SourceBoundary|DevicePolicy|WindowsBinaryBoundary|PromotionGate|SlangContract)" --output-on-failure

      - name: Prepare SDK
        run: bash Scripts/MacOS/3-PrepareSDK.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRHI SDK (macOS ${{ runner.arch }})
          path: _OpenRHI_SDK

  Build-iOS:
    runs-on: macos-latest
    strategy:
      matrix:
        sdk: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Configure native Metal static library
        run: >-
          cmake -S . -B _Build -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }}
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DOPENRHI_ENABLE_METAL_SUPPORT=ON
          -DOPENRHI_ENABLE_NIS_SDK=ON
          -DOPENRHI_ENABLE_IMGUI_EXTENSION=ON
          -DOPENRHI_STATIC_LIBRARY=ON
      - name: Build
        run: cmake --build _Build --config Release --parallel
      - name: Package
        run: |
          mkdir -p _OpenRHI_SDK/Lib/Release
          cp -R Include CMake _OpenRHI_SDK/
          cp LICENSE.txt THIRD_PARTY_NOTICES.md README.md MIGRATION.md QUALIFICATION.md SHADERS.md openrhi.natvis _OpenRHI_SDK/
          find _Bin -name 'libOpenRHI.a' -exec cp {} _OpenRHI_SDK/Lib/Release/ \;
          find _Bin -type d -name ThirdPartyLicenses -exec cp -R {} _OpenRHI_SDK/Lib/Release/ \;
          test -f _OpenRHI_SDK/Lib/Release/libOpenRHI.a
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRHI SDK (iOS ${{ matrix.sdk }} ARM64)
          path: _OpenRHI_SDK
